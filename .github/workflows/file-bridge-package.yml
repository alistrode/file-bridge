name: Upload File Bridge runtime package
on:
  push:
    branches: [projects/file-bridge]
    paths: [.github/workflows/file-bridge-package.yml]
permissions:
  contents: write
jobs:
  upload-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact branch archive to the existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          archive="release/File-Bridge-${version}-windows-x64.zip"
          tag="file-bridge-v${version}"
          test -s "$archive"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --draft --target "$GITHUB_SHA" --title "File Bridge ${version} Windows x64" --notes 'Windows 完整包；实际验收通过后发布。' --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" "$archive" --clobber --repo "$GITHUB_REPOSITORY"
