name: Upload File Bridge runtime package
on:
  push:
    branches: [projects/file-bridge]
    paths: [.github/workflows/file-bridge-package.yml]
permissions:
  contents: write
jobs:
  upload-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact branch archive to the existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release/File-Bridge-3.1.0-windows-x64.zip
          gh release upload file-bridge-v3.1.0 release/File-Bridge-3.1.0-windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
