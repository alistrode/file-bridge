<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>File Bridge</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">FILE BRIDGE</p>
          <h1>打开网页，就能传。</h1>
          <p class="intro">
            手机、电脑打开同一个网址，文字、图片和文件随手互传。
          </p>
        </div>
        <span id="connection" role="status">正在连接…</span>
      </header>
      <p id="notice" role="status" aria-live="polite"></p>
      <div class="send-grid">
        <section class="card">
          <h2>发送文字</h2>
          <form id="textForm">
            <label class="sr-only" for="text">要发送的文字</label
            ><textarea
              id="text"
              placeholder="粘贴链接、文字或想留给另一边的内容…"
              maxlength="500000"
              required
            ></textarea
            ><button id="sendText" type="submit" disabled>
              发送文字 <span aria-hidden="true">↗</span>
            </button>
          </form>
        </section>
        <section class="card">
          <h2>发送文件或图片</h2>
          <label class="pick" id="dropZone" for="file"
            ><span class="upload-icon" aria-hidden="true">↑</span
            ><strong>拖入文件，或点击选择</strong
            ><span class="muted">单个文件最大 1 GB</span
            ><input id="file" type="file"
          /></label>
          <p id="fileName" class="muted">未选择文件</p>
          <button id="sendFile" disabled>
            发送文件 <span aria-hidden="true">↗</span>
          </button>
        </section>
      </div>
      <section class="card queue-card">
        <div class="section-head">
          <h2>发送记录</h2>
          <span class="muted">收到保存确认后，才算发送完成</span>
        </div>
        <p class="muted">
          待发送内容会保存在当前浏览器，断线或刷新后继续。请保留此网站的浏览器数据。
        </p>
        <div id="queue" aria-live="polite">
          <p class="empty">还没有待发送的内容</p>
        </div>
      </section>
      <section class="card">
        <div class="section-head">
          <h2 id="receivedTitle">最近收到</h2>
          <div class="tabs">
            <button id="recentTab" class="tab active" aria-pressed="true">
              最近收到</button
            ><button id="archiveTab" class="tab" aria-pressed="false">
              已归档
            </button>
          </div>
        </div>
        <p id="retention" class="muted">
          最近内容保留 24 小时，归档后保存在主机上。
        </p>
        <div id="items" aria-live="polite"><p class="empty">正在加载…</p></div>
      </section>
      <footer>同一个网址，同一份内容。主机需要保持开机和联网。</footer>
    </main>
  </body>
</html>
